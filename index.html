<body>
<div id="m">…</div>
<script>
// Մշտական մուտքի էջ. միշտ բացում է վերջին տարբերակը (latest.json)։ BotFather-ում հղումը մեկ անգամ է դրվում։
var FALLBACK = "app_v30.html";
function go(f) { location.replace(f + location.search + location.hash); }
try {
  fetch("latest.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { go(j && j.file ? j.file : FALLBACK); })
    .catch(function () { go(FALLBACK); });
  setTimeout(function () { go(FALLBACK); }, 4000);
} catch (e) { go(FALLBACK); }
</script>
</body>
